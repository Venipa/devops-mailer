name: Build and Release VSIX

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Package extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: getVersion
        uses: actions/github-script@v7
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        with:
          script: |
            const stableSemverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
            const dispatchVersion = (context.payload?.inputs?.version || "").trim()
            const refName = (process.env.REF_NAME || "").trim()
            const refType = (process.env.REF_TYPE || "").trim()
            const tagVersion = refType === "tag" ? refName.replace(/^v/, "") : ""
            const version = tagVersion || dispatchVersion

            if (!version) {
              core.setFailed("Missing version. Push tag vX.Y.Z or provide workflow_dispatch input 'version'.")
              return
            }

            const isValid = stableSemverPattern.test(version)
            if (!isValid) {
              core.setFailed(`Invalid stable semver '${version}'. Expected X.Y.Z.`)
              return
            }

            const [major, minor, patch] = version.split(".").map((value) => Number(value))
            core.setOutput("value", version)
            core.setOutput("major", major)
            core.setOutput("minor", minor)
            core.setOutput("patch", patch)

      - name: Set package version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: package.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}

      - name: Set extension version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/vss-extension.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}

      - name: Set task version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/tasks/devops-mailer/task.json
          field: version
          value: '{"Major": ${{ steps.getVersion.outputs.major }}, "Minor": ${{ steps.getVersion.outputs.minor }}, "Patch": ${{ steps.getVersion.outputs.patch }}}'
          parse_json: true

      - name: Build and package VSIX
        run: bun run package:extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-vsix-${{ steps.getVersion.outputs.value }}
          path: release/*.vsix
          if-no-files-found: error

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.vsix
          generate_release_notes: true
